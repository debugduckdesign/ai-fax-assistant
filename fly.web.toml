# flyctl deploy --config fly.web.toml
#
# Set API_UPSTREAM to your API app's private DNS, e.g. ai-fax-assistant-api.internal:8000

app = "ai-fax-assistant-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.frontend"

[env]
  API_UPSTREAM = "ai-fax-assistant-api.internal:8000"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
