# fly.toml — create the app/volume once, then GitHub Actions deploys on main.
#   fly apps create ai-fax-assistant
#   fly volumes create fax_data --region ams --size 1 -a ai-fax-assistant
#   fly secrets set ANTHROPIC_API_KEY=... ELEVENLABS_API_KEY=... ... -a ai-fax-assistant
#
# Rename `app` if the name is taken.

app = "ai-fax-assistant"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  DATABASE_PATH = "/data/app.db"
  REDIS_URL = "redis://127.0.0.1:6379/0"
  REQUIREMENTS_PATH = "/app/templates/requirements.md"
  SESSION_COOKIE_SECURE = "true"
  ALLOW_INSECURE_WEBHOOKS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "fax_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
