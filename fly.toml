# fly.toml app configuration file generated for ai-fax-assistant on 2026-08-12T17:17:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-fax-assistant'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOW_INSECURE_WEBHOOKS = 'false'
  DATABASE_PATH = '/data/app.db'
  DATA_DIR = '/data'
  REDIS_URL = 'redis://127.0.0.1:6379/0'
  REQUIREMENTS_PATH = '/app/templates/requirements.md'
  SESSION_COOKIE_SECURE = 'true'

[[mounts]]
  source = 'fax_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
