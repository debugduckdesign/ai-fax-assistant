# Single Fly app: UI + API (+ local Redis fallback). Volume region must match primary_region.
#   fly apps create ai-fax-assistant
#   fly volumes create fax_data --region ams --size 1 -a ai-fax-assistant
#
# Optional split deploy (compose-style): fly.web.toml + Dockerfile.backend — not used by default.

app = "ai-fax-assistant"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  DATABASE_PATH = "/data/app.db"
  REQUIREMENTS_PATH = "/app/templates/requirements.md"
  SESSION_COOKIE_SECURE = "true"
  ALLOW_INSECURE_WEBHOOKS = "false"
  # Overridden when REDIS_URL secret points at Upstash; otherwise start.sh runs local Redis.
  REDIS_URL = "redis://127.0.0.1:6379/0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "fax_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
