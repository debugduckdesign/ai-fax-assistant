services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      DATABASE_PATH: /data/app.db
      REQUIREMENTS_PATH: /app/templates/requirements.md
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis_data:
